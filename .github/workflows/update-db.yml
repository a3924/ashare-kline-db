# GitHub Actions — 每个交易日收盘后自动刷新 K 线静态库
# 手动触发：仓库 Actions 页 Run workflow / API dispatch。
name: refresh-kline-db

on:
  schedule:
    # 周一至周五 22:40 UTC = 北京时间次日 06:40（收盘后次日凌晨，行情稳定）
    - cron: '40 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run update
        run: python3 update_db.py
      - name: Commit & push
        run: |
          git config user.name "a3924"
          git config user.email "a3924@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "db refresh $(date +%Y%m%d)"
          git push origin main
